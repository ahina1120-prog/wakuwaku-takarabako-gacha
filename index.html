<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>わくわく宝箱ガチャ</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  background: linear-gradient(180deg, #dff5d8, #fff3df);
  overflow-x: hidden;
}

#app {
  min-height: 100vh;
  display: flex;
  justify-content: center;
}

.screen {
  width: 100%;
  max-width: 100％;
  min-height: 100vh;
  padding: 24px 18px 35px;
  text-align: center;
  position: relative;
}

.title {
  margin-top: 10px;
  font-size: 32px;
  font-weight: 900;
  color: #fff;
  text-shadow:
    0 4px 0 #c99a35,
    0 6px 10px rgba(120,80,20,0.25);
  letter-spacing: 1px;
}

.speech {
  margin: 20px auto 14px;
  padding: 12px 18px;
  width: fit-content;
  max-width: 90%;
  background: white;
  border-radius: 22px;
  box-shadow: 0 5px 15px rgba(80,60,30,0.15);
  color: #765b62;
  font-weight: bold;
}

.info {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 12px 0 20px;
}

.info-box {
  background: rgba(255,255,255,0.85);
  padding: 9px 14px;
  border-radius: 18px;
  box-shadow: 0 4px 10px rgba(80,60,30,0.12);
  color: #795b61;
  font-weight: bold;
  font-size: 14px;
}

.chest-area {
  position: relative;
  margin: 20px auto;
  width: 250px;
  height: 230px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.chest {
  font-size: 150px;
  line-height: 1;
  filter: drop-shadow(0 12px 8px rgba(80,50,20,0.2));
  transition: transform 0.15s;
}

.chest.shake {
  animation: shake 0.12s infinite;
}

@keyframes shake {
  0%   { transform: rotate(-4deg) translateX(-3px); }
  50%  { transform: rotate(4deg) translateX(3px); }
  100% { transform: rotate(-4deg) translateX(-3px); }
}

.sparkle {
  position: absolute;
  font-size: 30px;
  opacity: 0;
}

.sparkle.show {
  animation: sparkle 1.2s ease-out forwards;
}

.sparkle:nth-child(2) { top: 20px; left: 30px; }
.sparkle:nth-child(3) { top: 35px; right: 25px; }
.sparkle:nth-child(4) { bottom: 20px; left: 45px; }
.sparkle:nth-child(5) { bottom: 25px; right: 45px; }

@keyframes sparkle {
  0% {
    opacity: 0;
    transform: scale(0.2) rotate(0deg);
  }
  40% {
    opacity: 1;
    transform: scale(1.4) rotate(90deg);
  }
  100% {
    opacity: 0;
    transform: scale(0.8) rotate(180deg);
  }
}

.open-button {
  border: none;
  width: 85%;
  max-width: 330px;
  padding: 17px 20px;
  border-radius: 35px;
  background: linear-gradient(180deg, #ffb9d4, #f58eaf);
  color: white;
  font-size: 20px;
  font-weight: 900;
  box-shadow:
    0 7px 0 #d96d91,
    0 10px 18px rgba(150,70,100,0.2);
  cursor: pointer;
}

.open-button:active {
  transform: translateY(5px);
  box-shadow:
    0 2px 0 #d96d91,
    0 5px 10px rgba(150,70,100,0.15);
}

.open-button:disabled {
  opacity: 0.6;
}

.result {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  background: rgba(255,248,238,0.96);
  align-items: center;
  justify-content: center;
  padding: 25px;
}

.result.show {
  display: flex;
}

.result-card {
  width: 100%;
  max-width: 380px;
  padding: 30px 20px;
  background: white;
  border-radius: 30px;
  box-shadow: 0 10px 30px rgba(80,60,30,0.2);
}

.result-card h2 {
  color: #d99a35;
  margin-bottom: 12px;
}

.amount {
  font-size: 64px;
  font-weight: 900;
  color: #e88a9f;
  text-shadow: 0 4px 0 #ffd8df;
  margin: 20px 0;
}

.home-button {
  border: none;
  border-radius: 25px;
  padding: 13px 30px;
  background: #b9dcae;
  color: white;
  font-size: 17px;
  font-weight: bold;
}/* 横向き表示対応 */
@media (orientation: landscape) {
  body {
    overflow-x: hidden;
  }

  .home-button {
    transform: scale(0.8);
    transform-origin: center;
  }
}
</style>
</head>

<body>

<div id="app">

  <main class="screen">

    <div class="title">
      🎁 わくわく宝箱ガチャ
    </div>

    <div class="speech">
      売り協力ありがとう！✨
    </div>

    <div class="info">
      <div class="info-box">
        🎟️ ガチャ券：1
      </div>

      <div class="info-box">
        👥 参加人数：0
      </div>
    </div>

    <div class="chest-area">

      <div class="chest">🎁</div>

      <div class="sparkle">✨</div>
      <div class="sparkle">⭐</div>
      <div class="sparkle">💫</div>
      <div class="sparkle">✨</div>

    </div>

    <button class="open-button" id="openButton">
      🎁 宝箱を開ける
    </button>

  </main>

</div>

<div class="result" id="result">

  <div class="result-card">

    <h2>🎉 おめでとう！ 🎉</h2>

    <div class="amount" id="amount">
      10円
    </div>

    <p>
      ありがとうの気持ちを<br>
      受け取ってね✨
    </p>

    <button class="home-button" id="homeButton">
      🏠 ホームへ戻る
    </button>

  </div>

</div>

<script>

const openButton = document.getElementById("openButton");
const homeButton = document.getElementById("homeButton");
const chest = document.querySelector(".chest");
const sparkles = document.querySelectorAll(".sparkle");
const result = document.getElementById("result");
const amount = document.getElementById("amount");

const prizes = [10, 50, 100, 300, 500];

openButton.addEventListener("click", () => {

  openButton.disabled = true;

  // ① 宝箱がブルブル
  chest.classList.add("shake");

  // ② キラキラ
  setTimeout(() => {
    sparkles.forEach(sparkle => {
      sparkle.classList.add("show");
    });
  }, 500);

  // ③〜⑤ 宝箱オープン演出
  setTimeout(() => {
    chest.classList.remove("shake");
    chest.textContent = "✨🎁✨";
  }, 1500);

  // 抽選
  setTimeout(() => {

    const prize =
      prizes[Math.floor(Math.random() * prizes.length)];

    amount.textContent = prize + "円";

    result.classList.add("show");

    openButton.disabled = false;

  }, 2200);

});

homeButton.addEventListener("click", () => {

  result.classList.remove("show");

  chest.textContent = "🎁";

  sparkles.forEach(sparkle => {
    sparkle.classList.remove("show");
  });

});

</script>

</body>
</html>
