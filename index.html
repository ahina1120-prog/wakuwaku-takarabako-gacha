<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>わくわく宝箱ガチャ</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100vh;
  font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  background: linear-gradient(180deg, #dff5d8, #fff3df);
  overflow-x: hidden;
}

#app {
  min-height: 100vh;
  width: 100%;
  display: flex;
  justify-content: center;
}

.screen {
  width: 100%;
  max-width: 100%;
  min-height: 100vh;
  padding: 24px 18px 35px;
  text-align: center;
  position: relative;
}

.title {
  margin-top: 10px;
  font-size: 32px;
  font-weight: 900;
  color: #fff;
  text-shadow:
    0 4px 0 #c99a35,
    0 6px 10px rgba(120,80,20,0.25);
  letter-spacing: 1px;
}

.speech {
  margin: 20px auto 14px;
  padding: 12px 18px;
  width: fit-content;
  max-width: 90%;
  background: white;
  border-radius: 22px;
  box-shadow: 0 5px 15px rgba(80,60,30,0.15);
  color: #765b62;
  font-weight: bold;
}

.info {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 12px 0 20px;
}

.info-box {
  background: rgba(255,255,255,0.85);
  padding: 9px 14px;
  border-radius: 18px;
  box-shadow: 0 4px 10px rgba(80,60,30,0.12);
  color: #795b61;
  font-weight: bold;
  font-size: 14px;
}

.chest-area {
  position: relative;
  margin: 20px auto;
  width: min(90vw, 500px);
  height: min(55vh, 500px);
  display: flex;
  justify-content: center;
  align-items: center;
}

.chest-image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
  filter: drop-shadow(0 12px 8px rgba(80,50,20,0.18));
}

.open-button {
  border: none;
  width: 85%;
  max-width: 330px;
  padding: 17px 20px;
  border-radius: 35px;
  background: linear-gradient(180deg, #ffb9d4, #f58eaf);
  color: white;
  font-size: 20px;
  font-weight: 900;
  box-shadow:
    0 7px 0 #d96d91,
    0 10px 18px rgba(150,70,100,0.2);
  cursor: pointer;
}

.open-button:active {
  transform: translateY(5px);
  box-shadow:
    0 2px 0 #d96d91,
    0 5px 10px rgba(150,70,100,0.15);
}

.open-button:disabled {
  opacity: 0.6;
}

.result {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  background: rgba(255,248,238,0.96);
  align-items: center;
  justify-content: center;
  padding: 0;
}

.result.show {
  display: flex;
}

.result-card {
  width: 100vw;
  max-width: none;
  padding: 0;
  background: transparent;
  border-radius: 0;
  box-shadow: none;
}

#resultImage {
  display: block;
  width: 100vw;
  max-width: 100vw;
  height: auto;
  max-height: 100vh;
  object-fit: contain;
  margin: 0 auto;
  cursor: pointer;
}

@media (orientation: landscape) {
  .screen {
    padding: 10px 20px 20px;
  }

  .title {
    margin-top: 0;
    font-size: 25px;
  }

  .speech {
    margin: 8px auto;
    padding: 8px 16px;
  }

  .info {
    margin: 8px 0 10px;
  }

  .chest-area {
    width: min(65vw, 650px);
    height: 52vh;
    margin: 10px auto;
  }

  .open-button {
    padding: 12px 20px;
  }
}
</style>
</head>

<body>

<div id="app">

  <main class="screen">

    <div class="title">
      🎁 わくわく宝箱ガチャ
    </div>

    <div class="speech">
      売り協力ありがとう！✨
    </div>

    <div class="info">
      <div class="info-box">
        🎟️ ガチャ券：1
      </div>

      <div class="info-box">
        👥 参加人数：0
      </div>
    </div>

    <div class="chest-area">
      <img
        id="chestImage"
        class="chest-image"
        src="home.png"
        alt="わくわく宝箱"
      >
    </div>

    <button class="open-button" id="openButton">
      🎁 宝箱を開ける
    </button>

  </main>

</div>

<div class="result" id="result">

  <div class="result-card">
    <img
      id="resultImage"
      src="result-10.png"
      alt="当選結果"
    >
  </div>

</div>

<script>

const openButton = document.getElementById("openButton");
const chestImage = document.getElementById("chestImage");
const result = document.getElementById("result");
const resultImage = document.getElementById("resultImage");

const animationImages = [
  "chest_01_shake.PNG",
  "chest_02_key_flash.PNG",
  "chest_03_light.PNG",
  "chest_04_open.PNG",
  "chest_05_confetti.PNG"
];

const prizes = [
  {
    amount: 10,
    image: "result-10.png"
  },
  {
    amount: 50,
    image: "result-50.png"
  },
  {
    amount: 100,
    image: "result-100.png"
  },
  {
    amount: 300,
    image: "result-300.png"
  },
  {
    amount: 500,
    image: "result-500.png"
  }
];

let isOpening = false;

openButton.addEventListener("click", () => {

  if (isOpening) {
    return;
  }

  isOpening = true;
  openButton.disabled = true;

  /*
   * ① 宝箱が揺れる
   */
  chestImage.src = animationImages[0];

  /*
   * ② 鍵と光
   */
  setTimeout(() => {
    chestImage.src = animationImages[1];
  }, 700);

  /*
   * ③ 光が広がる
   */
  setTimeout(() => {
    chestImage.src = animationImages[2];
  }, 1400);

  /*
   * ④ 宝箱オープン
   */
  setTimeout(() => {
    chestImage.src = animationImages[3];
  }, 2100);

  /*
   * ⑤ 紙吹雪
   */
  setTimeout(() => {
    chestImage.src = animationImages[4];
  }, 2800);

  /*
   * ⑥ 当選結果
   */
  setTimeout(() => {

    const prize =
      prizes[Math.floor(Math.random() * prizes.length)];

    resultImage.src = prize.image;

    result.classList.add("show");

  }, 3500);

});

/*
 * 当選結果をタップするとホームに戻る
 */
resultImage.addEventListener("click", () => {

  result.classList.remove("show");

  chestImage.src = "home.png";

  openButton.disabled = false;

  isOpening = false;

});

</script>

</body>
</html>
